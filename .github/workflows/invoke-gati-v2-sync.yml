# Syncs actions/invoke-gati-v2 from smartcontractkit/.github-internal and opens
# a PR with the result. See actions/invoke-gati-v2/scripts/sync.sh.
#
# Only the released invoke-gati-v2/v1 tag is synced, so nothing reaches this
# repository before it has been versioned upstream.
name: invoke-gati-v2 sync

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync and open PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SOURCE_REF: invoke-gati-v2/v1
      # Owned by this workflow: every run resets it to the dispatched commit, so
      # anything pushed to it by hand is discarded.
      SYNC_BRANCH: chore/invoke-gati-v2-sync
      BASE_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Get a token for the source repository
        id: source-token
        uses: smartcontractkit/.github/actions/setup-github-token@setup-github-token/v1
        with:
          profile: github-internal-sync

      - name: Sync from the source repository
        id: sync
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.access-token }}
        run: ./actions/invoke-gati-v2/scripts/sync.sh --ref "${SOURCE_REF}"

      - name: Check for changes
        id: changes
        run: |
          set -euo pipefail

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Already in sync with ${SOURCE_REF}."
            echo "changed=false" | tee -a "${GITHUB_OUTPUT}"
            exit 0
          fi

          git status --short
          echo "changed=true" | tee -a "${GITHUB_OUTPUT}"

      - name: Get a token for this repository
        if: steps.changes.outputs.changed == 'true'
        id: pr-token
        uses: smartcontractkit/.github/actions/setup-github-token@setup-github-token/v1
        with:
          profile: globals/pr-self

      # ghcommit commits on top of the remote branch, so point it at the
      # checked-out commit first, creating it if this is the first sync.
      - name: Reset the sync branch
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.pr-token.outputs.access-token }}
        run: |
          set -euo pipefail

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${SYNC_BRANCH}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${SYNC_BRANCH}" \
              -f sha="${GITHUB_SHA}" -F force=true >/dev/null
            echo "Reset ${SYNC_BRANCH} to ${GITHUB_SHA}."
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/heads/${SYNC_BRANCH}" -f sha="${GITHUB_SHA}" >/dev/null
            echo "Created ${SYNC_BRANCH} at ${GITHUB_SHA}."
          fi

      - name: Commit
        if: steps.changes.outputs.changed == 'true'
        uses: planetscale/ghcommit-action@25309d8005ac7c3bcd61d3fe19b69e0fe47dbdde # v0.2.20
        with:
          commit_message:
            "chore(invoke-gati-v2): sync to ${{ steps.sync.outputs.version }}"
          repo: ${{ github.repository }}
          branch: ${{ env.SYNC_BRANCH }}
        env:
          GITHUB_TOKEN: ${{ steps.pr-token.outputs.access-token }}

      - name: Open PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.pr-token.outputs.access-token }}
          VERSION: ${{ steps.sync.outputs.version }}
          SOURCE_SHA: ${{ steps.sync.outputs.sha }}
        run: |
          set -euo pipefail

          existing=$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${SYNC_BRANCH}" \
            --base "${BASE_BRANCH}" --state open --json url --jq '.[0].url // empty')
          if [[ -n "${existing}" ]]; then
            echo "Updated existing PR: ${existing}"
            exit 0
          fi

          body=$(cat <<EOF
          Syncs \`actions/invoke-gati-v2\` to \`${VERSION}\` from \`smartcontractkit/.github-internal@${SOURCE_REF}\` (${SOURCE_SHA}).

          Generated by [invoke-gati-v2 sync](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).
          EOF
          )

          gh pr create --repo "${GITHUB_REPOSITORY}" \
            --head "${SYNC_BRANCH}" --base "${BASE_BRANCH}" \
            --title "chore(invoke-gati-v2): sync to ${VERSION}" \
            --body "${body}"
