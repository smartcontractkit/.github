# Exercises actions/setup-github-token across both GATI flows.
#
# This repository is public, so these workflow logs are public. Keep the checks
# below to assertions on emptiness and equality — never print tokens or role
# ARNs.
name: setup-github-token validate

on:
  pull_request:
    paths:
      - "actions/setup-github-token/**"
      - ".github/workflows/setup-github-token-validate.yml"
  push:
    branches:
      - main
    paths:
      - "actions/setup-github-token/**"
      - ".github/workflows/setup-github-token-validate.yml"
  workflow_dispatch:

permissions: {}

jobs:
  decision-logic:
    name: Version decision logic
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ARN: arn:aws:iam::123456789012:role/example
      URL: https://example.lambda-url.us-west-2.on.aws/
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the decision table
        working-directory: actions/setup-github-token/scripts
        run: |
          set -uo pipefail

          failures=0

          # check <description> <want-exit> <want-outputs> [NAME=VALUE ...]
          check() {
            local description="$1" want_exit="$2" want_outputs="$3"
            shift 3

            local output_file got_exit got_outputs
            output_file="$(mktemp)"
            env GITHUB_OUTPUT="${output_file}" "$@" \
              ./resolve-gati-version.sh >/dev/null 2>&1 && got_exit=0 || got_exit=1
            got_outputs="$(paste -sd' ' "${output_file}")"

            if [[ "${got_exit}" == "${want_exit}" && "${got_outputs}" == "${want_outputs}" ]]; then
              echo "ok   ${description}"
              return
            fi

            echo "FAIL ${description}"
            echo "       want: exit=${want_exit} outputs='${want_outputs}'"
            echo "       got:  exit=${got_exit} outputs='${got_outputs}'"
            failures=$((failures + 1))
          }

          # No pins, no rollout: every case below opts into what it exercises.
          base=(
            GITHUB_REPOSITORY=owner/repository
            ROLLOUT_PERCENTAGE=0
            FORCE_V1_REPOSITORIES=
            FORCE_V2_REPOSITORIES=
          )
          aws=(AWS_ROLE_ARN="${ARN}" AWS_LAMBDA_URL="${URL}")

          check "gati-version v1 selects v1" \
            0 "version=v1" \
            "${base[@]}" "${aws[@]}" GATI_VERSION=v1

          check "gati-version v1 with a profile is rejected" \
            1 "" \
            "${base[@]}" GATI_VERSION=v1 PROFILE=example

          check "gati-version v2 derives a v1 profile from the role ARN" \
            0 "version=v2 profile=v1/${ARN}" \
            "${base[@]}" "${aws[@]}" GATI_VERSION=v2

          check "gati-version v2 passes an explicit profile through" \
            0 "version=v2 profile=example" \
            "${base[@]}" GATI_VERSION=v2 PROFILE=example

          check "an unknown gati-version is rejected" \
            1 "" \
            "${base[@]}" "${aws[@]}" GATI_VERSION=v3

          check "a profile alone selects v2, without the aws inputs" \
            0 "version=v2 profile=presets/example" \
            "${base[@]}" PROFILE=presets/example

          check "the v1 pin wins over the v2 pin" \
            0 "version=v1" \
            "${base[@]}" "${aws[@]}" ROLLOUT_PERCENTAGE=100 \
            FORCE_V1_REPOSITORIES=owner/repository \
            FORCE_V2_REPOSITORIES=owner/repository

          check "the v2 pin overrides a 0% rollout" \
            0 "version=v2 profile=v1/${ARN}" \
            "${base[@]}" "${aws[@]}" \
            FORCE_V2_REPOSITORIES="$(printf 'other/repository\nowner/repository')"

          check "the v1 pin overrides a 100% rollout" \
            0 "version=v1" \
            "${base[@]}" "${aws[@]}" ROLLOUT_PERCENTAGE=100 \
            FORCE_V1_REPOSITORIES="$(printf 'other/repository\nowner/repository')"

          check "a pin matches whole lines only" \
            0 "version=v1" \
            "${base[@]}" "${aws[@]}" FORCE_V2_REPOSITORIES=owner/repositories

          check "a 0% rollout selects v1" \
            0 "version=v1" \
            "${base[@]}" "${aws[@]}"

          check "a 100% rollout selects v2" \
            0 "version=v2 profile=v1/${ARN}" \
            "${base[@]}" "${aws[@]}" ROLLOUT_PERCENTAGE=100

          check "aws-role-arn is required without a profile" \
            1 "" \
            "${base[@]}" AWS_LAMBDA_URL="${URL}"

          check "aws-lambda-url is required without a profile" \
            1 "" \
            "${base[@]}" AWS_ROLE_ARN="${ARN}"

          if ((failures > 0)); then
            echo "${failures} case(s) failed."
            exit 1
          fi
          echo "All cases passed."

      # Sweeping the percentage rather than recomputing the hash keeps this
      # independent of how a repository is bucketed. A single flip proves the
      # bucket is stable across invocations and that the threshold is a
      # one-directional cutover.
      - name: Check the rollout threshold is a stable, one-way cutover
        working-directory: actions/setup-github-token/scripts
        run: |
          set -euo pipefail

          output_file="$(mktemp)"
          previous=""
          flips=0

          for percentage in $(seq 0 100); do
            env GITHUB_OUTPUT="${output_file}" \
              GITHUB_REPOSITORY=owner/repository \
              ROLLOUT_PERCENTAGE="${percentage}" \
              FORCE_V1_REPOSITORIES= \
              FORCE_V2_REPOSITORIES= \
              AWS_ROLE_ARN="${ARN}" \
              AWS_LAMBDA_URL="${URL}" \
              ./resolve-gati-version.sh >/dev/null
            version="$(sed -n 's/^version=//p' "${output_file}")"
            : >"${output_file}"

            if [[ -n "${previous}" && "${version}" != "${previous}" ]]; then
              flips=$((flips + 1))
              echo "Flipped to ${version} at ${percentage}%."
            fi
            previous="${version}"

            if [[ "${percentage}" == "0" && "${version}" != "v1" ]]; then
              echo "Expected v1 at 0%, got ${version}."
              exit 1
            fi
          done

          if [[ "${previous}" != "v2" ]]; then
            echo "Expected v2 at 100%, got ${previous}."
            exit 1
          fi

          if [[ "${flips}" != "1" ]]; then
            echo "Expected exactly 1 flip across the sweep, got ${flips}."
            exit 1
          fi
          echo "The rollout crossed from v1 to v2 exactly once."

  v1-forced:
    name: GATI v1 (forced)
    # Repository secrets are unavailable to pull requests from forks.
    if:
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repo (needed to reference local action)
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup GitHub token
        id: setup
        uses: ./actions/setup-github-token
        with:
          gati-version: v1
          aws-role-arn: ${{ secrets.AWS_OIDC_IAM_ROLE_ARN_GATI }}
          aws-lambda-url: ${{ secrets.AWS_LAMBDA_URL_GATI }}
          set-git-config: "true"

      - name: Check v1 issued the token and configured git
        env:
          ACCESS_TOKEN: ${{ steps.setup.outputs.access-token }}
          GATI_VERSION: ${{ steps.setup.outputs.gati-version }}
        run: |
          set -euo pipefail

          if [[ "${GATI_VERSION}" != "v1" ]]; then
            echo "Expected gati-version 'v1', got '${GATI_VERSION}'."
            exit 1
          fi

          if [[ -z "${ACCESS_TOKEN}" ]]; then
            echo "No access token was returned."
            exit 1
          fi

          # The insteadOf key embeds the token, so match without printing it.
          if ! git config --global --list --name-only | grep -q "insteadof"; then
            echo "set-git-config did not configure git."
            exit 1
          fi
          echo "GATI v1 issued a token and configured git."

  v2-rollout:
    name: GATI v2 (via rollout)
    if:
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repo (needed to reference local action)
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No profile, so the rollout decides. This repository is pinned to v2.
      - name: Setup GitHub token
        id: setup
        uses: ./actions/setup-github-token
        with:
          aws-role-arn: ${{ secrets.AWS_OIDC_IAM_ROLE_ARN_GATI }}
          aws-lambda-url: ${{ secrets.AWS_LAMBDA_URL_GATI }}

      - name: Check v2 issued the token
        env:
          ACCESS_TOKEN: ${{ steps.setup.outputs.access-token }}
          GATI_VERSION: ${{ steps.setup.outputs.gati-version }}
        run: |
          set -euo pipefail

          if [[ "${GATI_VERSION}" != "v2" ]]; then
            echo "Expected gati-version 'v2', got '${GATI_VERSION}'."
            exit 1
          fi

          if [[ -z "${ACCESS_TOKEN}" ]]; then
            echo "No access token was returned."
            exit 1
          fi
          echo "GATI v2 issued a token from the role ARN it was given."

  v2-explicit-profile:
    name: GATI v2 (explicit profile)
    if:
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repo (needed to reference local action)
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup GitHub token
        id: setup
        uses: ./actions/setup-github-token
        with:
          profile: v1/${{ secrets.AWS_OIDC_IAM_ROLE_ARN_GATI }}

      - name: Check v2 issued the token
        env:
          ACCESS_TOKEN: ${{ steps.setup.outputs.access-token }}
          GATI_VERSION: ${{ steps.setup.outputs.gati-version }}
        run: |
          set -euo pipefail

          if [[ "${GATI_VERSION}" != "v2" ]]; then
            echo "Expected gati-version 'v2', got '${GATI_VERSION}'."
            exit 1
          fi

          if [[ -z "${ACCESS_TOKEN}" ]]; then
            echo "No access token was returned."
            exit 1
          fi
          echo "GATI v2 issued a token from the profile it was given."
