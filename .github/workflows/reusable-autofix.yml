          tidy).
        required: false
        type: boolean
        default: false
      go-recursive:
        description: |
          Run the Go fixers in every module in `paths` in or below
          `working-directory`. When false, only in the module at
          `working-directory`.
        required: false
        type: boolean
        default: true
      always:
        description: Run on pull requests that change no file in `paths` too.
        required: false
        type: boolean
        default: false
      setup-go:
