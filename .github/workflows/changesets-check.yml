name: Changesets Check

on:
  pull_request:

permissions: {}

jobs:
  check:
    name: Changesets Check
    if: github.event.pull_request.title != 'Version Packages'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Check for changeset
        uses: smartcontractkit/.github/actions/cicd-changesets-check@cicd-changesets-check/0.1.0
        with:
          token: ${{ github.token }}
