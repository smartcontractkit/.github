output:
  - summary
  - success
  - failure

pre-commit:
  parallel: true
  commands:
    prettier:
      description: "Fix prettier formatting"
      glob: "*.{json,md,scss,yaml,yml}"
      run: pnpm hook:fix {staged_files}
      stage_fixed: true
    reusable-workflows:
      description: "Fix reusable workflows sync"
      glob: "{workflows/*/*,.github/workflows/*}.{yml,yaml}"
      run: pnpm workflows:fix {staged_files}
      stage_fixed: true
    actionlint:
      description: "Run actionlint"
      glob: "{workflows/*/*,.github/workflows/*}.{yml,yaml}"
      run: actionlint {staged_files}
    shellcheck:
      description: "Run shellcheck"
      glob: "*.sh"
      run: shellcheck {staged_files}
    build-artifacts:
      description: "Build artifacts"
      glob: "package.json"
      run: pnpm build:artifacts
