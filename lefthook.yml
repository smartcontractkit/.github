output:
  - summary
  - success
  - failure

pre-commit:
  parallel: true
  jobs:
    - name: betterleaks
      run: betterleaks git . --pre-commit --staged -v
    - name: shellcheck
      glob: "*.sh"
      run: shellcheck {staged_files}
    - name: pipeline
      group:
        piped: true
        jobs:
          - name: code-lint
            glob: "*.{js,cjs,mjs,ts,cts,mts,tsx}"
            exclude:
              - "{dist,out}/*"
              - "*/{dist,out}/*"
            run: pnpm exec eslint --fix {staged_files}
            stage_fixed: true
          - name: prettier
            glob: "*.{js,cjs,mjs,ts,cts,mts,tsx,json,md,scss,yaml,yml}"
            exclude:
              - "{dist,out}/*"
              - "*/{dist,out}/*"
              - "{workflows,.github/workflows}/*"
            run:
              pnpm exec prettier --write --ignore-path=.prettierignore
              {staged_files}
            stage_fixed: true
          - name: reusable-workflows
            glob: "{workflows/*/*,.github/workflows/*}.{yml,yaml}"
            run: pnpm workflows:fix --stage {staged_files}
          - name: actionlint
            glob: "{workflows/*/*,.github/workflows/*}.{yml,yaml}"
            run: actionlint {staged_files}
          - name: build-artifacts
            glob: "*.{js,ts,json}"
            exclude:
              - "{dist,out}/*"
              - "*/{dist,out}/*"
            env:
              CI: "true"
            run: pnpm build:affected
            stage_fixed: true

pre-push:
  commands:
    test:
      glob: "*.{js,cjs,mjs,ts,cts,mts,tsx,json,sh,yaml,yml}"
      run: pnpm test:affected
