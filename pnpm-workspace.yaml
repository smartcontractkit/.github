packages:
  - actions/**
  - "!actions/signed-commits/__fixtures__/**"
  - libs/**
  - apps/**
  - workflows/**
allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  lefthook: true
  nx: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - electron-to-chromium@1.5.446
overrides:
  axios: ^1.20.0
  brace-expansion: ^5.0.12
  smol-toml: ^1.9.0
  form-data: 4.0.6
  shell-quote: 1.12.0
  vite: 7.3.7
  undici: 6.29.0
  "@graphql-tools/utils": 12.0.3
  "@fastify/busboy": 3.2.2
  http-cache-semantics: 4.3.0
  source-map-js: 1.2.2
  "picomatch@>=4.0.0": 4.0.7
  minimatch: ^10.2.6
  immutable: ^4.3.8
