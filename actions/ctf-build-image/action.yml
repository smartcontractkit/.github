name: ctf-build-image
description: "Common action for building chainlink test images"

inputs:
  # Docker inputs
  dockerfile:
    required: true
    description: The dockerfile to use to build the image with

  docker-additional-build-args:
    required: false
    description: |
      Additional build args to pass to the docker build command.
      These will be appended to the default build args.
      Example: |
        GO_COVER_FLAG=true
        CUSTOM_ARG=value

  image-tag:
    required: false
    description: The tag to use for the image.
    default: sha-${{ github.sha }}

  platform:
    # See: https://docs.docker.com/reference/cli/docker/buildx/build/#platform
    description:
      "Platform for the docker image, e.g. linux/amd64 or linux/arm64"
    required: false
    default: "linux/amd64"

  # Registry/ECR inputs
  docker-registry-url:
    description: |
      The docker registry to push the image to.
    required: true

  docker-repository-name:
    description: |
      The name of the docker repository to push the image to.
      Defaults to the repository name.
    required: true

  # AWS inputs
  aws-account-number:
    description: |
      The AWS account number for the ECR registry.
    required: true

  aws-region:
    description: |
      The AWS region to use for the ECR registry.
    required: true

  aws-role-arn:
    description: |
      The AWS role ARN to assume for pushing the image to ECR.
    required: true

  # GATI inputs
  gati-role-arn:
    description: |
      The GATI role ARN to assume for granting read access to private repositories.
      If not specified, the action will not attempt to grant access.
    required: false

  gati-lambda-url:
    description: |
      The GATI Lambda URL to use for granting read access to private repositories.
      If not specified, the action will not attempt to grant access.
    required: false

  gati-aws-region:
    description: |
      Optional: The AWS region to use for GATI.
    required: false
    default: "us-west-2"

  # Dependency/plugin override inputs
  plugin-manifest-overrides:
    required: false
    description: |
      A list of overrides for the plugin manifest to replace specific plugins.
      Format: "plugin=gitRef". Multiple plugins can be specified, one per line.
      If not specified, no overrides will be applied.

      For example:
      cosmos=foo
      starknet=bar

      Would update the plugin manifest at `plugins/plugins.public.yaml`, replacing:
        - plugins.cosmos.gitRef with `ref`.
        - plugins.starknet.gitRef with `bar`.

      Note: This will only update existing entries.

  go-get-overrides:
    required: false
    description: |
      A list of overrides for go get commands to replace specific dependencies.
      Format: "dependency=sha". Multiple dependencies can be specified, one per line.
      If not specified, no overrides will be applied.

      For example:
      chainlink-solana=abc123
      chainlink-evm=def456

      Would perform:
      go get github.com/smartcontractkit/chainlink-solana@abc123
      go get github.com/smartcontractkit/chainlink-evm@def456

  cache-scope:
    required: false
    description: |
      Custom scope for Docker build cache. Separates caches when multiple
      Dockerfiles build on the same architecture (e.g. "core" vs "plugins").
      If not set, defaults to runner OS and architecture.
    default: ""

  free-disk-space:
    required: false
    description: |
      Whether to run the free-disk-space step before building. Set to "false"
      on runners with sufficient disk (e.g. RunsOn with 100GB+) to save ~30-60s.
    default: "true"

  cache-mode:
    required: false
    description: |
      Caching mode preset: "auto" (default), "read-write", "read-only", "write-only", or "off".
      If unset, defaults to "auto" (restores cache for PRs, saves cache for default branch push/schedule events).
      See: https://docs.docker.com/build/ci/github-actions/cache/
    default: "auto"

  cache-map:
    required: false
    description: |
      JSON string mapping cache mount paths/names for buildkit-cache-dance (e.g. '{"go-mod-cache": "/go/pkg/mod"}').
      Passing a non-empty cache-map automatically enables buildkit-cache-dance.
      See: https://github.com/reproducible-containers/buildkit-cache-dance
      See: https://docs.docker.com/build/ci/github-actions/cache/#cache-mounts
    default: ""

  docker-restore-cache:
    required: false
    description: |
      Deprecated explicit override for docker restore cache ("true" or "false").
    default: ""

  docker-save-cache:
    required: false
    description: |
      Deprecated explicit override for docker save cache ("true" or "false").
    default: ""

  cache-dance:
    required: false
    description: |
      Deprecated: Explicitly enable/disable buildkit-cache-dance.
    default: ""

  cache-dance-cache-map:
    required: false
    description: |
      Deprecated alias for cache-map.
    default: ""

outputs:
  docker-image-sha-digest-amd64:
    description: "Docker image SHA digest for platform: amd64"
    value: ${{ steps.build-image.outputs.docker-image-sha-digest-amd64 }}
  docker-image-sha-digest-arm64:
    description: "Docker image SHA digest for platform: arm64"
    value: ${{ steps.build-image.outputs.docker-image-sha-digest-arm64 }}

runs:
  using: composite
  steps:
    - name: Setup GitHub token using GATI
      if: inputs.gati-role-arn != '' && inputs.gati-lambda-url != ''
      id: github-token
      uses: smartcontractkit/.github/actions/setup-github-token@setup-github-token/v1
      with:
        aws-role-arn: ${{ inputs.gati-role-arn }}
        aws-lambda-url: ${{ inputs.gati-lambda-url }}
        aws-region: ${{ inputs.gati-aws-region }}
        aws-role-duration-seconds: "1800"
        set-git-config: "true"

    - name: Process plugin manifest overrides (public)
      shell: bash
      env:
        PLUGIN_OVERRIDES: ${{ inputs.plugin-manifest-overrides }}
        PLUGINS_MANIFEST_PATH:
          ${{ github.workspace }}/plugins/plugins.public.yaml
      run: |
        if [[ -z "${PLUGIN_OVERRIDES}" ]]; then
          echo "No plugin overrides provided. Skipping manifest processing."
          exit 0
        fi

        if [[ ! -f "${PLUGINS_MANIFEST_PATH}" ]]; then
          echo "Manifest file not found: ${PLUGINS_MANIFEST_PATH}"
          exit 1
        fi

        echo "Applying plugin overrides..."
        while IFS= read -r line; do
          if [[ -n "$line" ]]; then
            plugin=$(echo "$line" | cut -d'=' -f1)
            override=$(echo "$line" | cut -d'=' -f2)
            echo "Overriding plugin: $plugin -> $override"
            yq eval -i "(.plugins[] | select(.name == \"$plugin\")).location = \"$override\"" "$PLUGINS_MANIFEST_PATH"
          fi
        done <<< "$PLUGIN_OVERRIDES"

    - name: Process Go dependency overrides
      shell: bash
      env:
        GO_OVERRIDES: ${{ inputs.go-get-overrides }}
      run: |
        if [[ -z "${GO_OVERRIDES}" ]]; then
          echo "No Go dependency overrides provided."
          exit 0
        fi

        echo "Applying Go dependency overrides..."
        while IFS= read -r line; do
          if [[ -n "$line" ]]; then
            module=$(echo "$line" | cut -d'=' -f1)
            override=$(echo "$line" | cut -d'=' -f2)
            echo "Replacing Go module: $module -> $override"
            go mod edit -replace "$module=$override"
          fi
        done <<< "$GO_OVERRIDES"
        go mod tidy

    - name: Free up disk space (to avoid 'no space left on device' errors)
      if: inputs.free-disk-space == 'true'
      uses: smartcontractkit/.github/actions/free-disk-space@free-disk-space/v1

    - name: Resolve cache settings
      shell: bash
      id: cache-settings
      env:
        ACTION_PATH: ${{ github.action_path }}
        CACHE_MODE: ${{ inputs.cache-mode }}
        DOCKER_SAVE_CACHE_INPUT: ${{ inputs.docker-save-cache }}
        DOCKER_RESTORE_CACHE_INPUT: ${{ inputs.docker-restore-cache }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
      run: |
        "${ACTION_PATH}/scripts/resolve-cache-settings.sh" >> "$GITHUB_OUTPUT"

    - name: Build push docker image
      id: build-image
      uses: smartcontractkit/.github/actions/build-push-docker@build-push-docker/v1
      with:
        context: .
        platform: ${{ inputs.platform }}

        dockerfile: ${{ inputs.dockerfile }}
        docker-build-args: |
          COMMIT_SHA=${{ github.sha }}
          CHAINLINK_USER=chainlink
          ${{ inputs.docker-additional-build-args }}
        docker-attestations: "false"
        docker-registry-url: ${{ inputs.docker-registry-url }}
        docker-repository-name: ${{ inputs.docker-repository-name }}
        docker-save-cache: ${{ steps.cache-settings.outputs.save-cache }}
        docker-restore-cache: ${{ steps.cache-settings.outputs.restore-cache }}
        docker-build-cache-to:
          "type=gha,timeout=10m,mode=max,ignore-error=true,compression=zstd,compression-level=3,scope=ctf-build-image-${{
          inputs.cache-scope || format('{0}-{1}', runner.os, runner.arch) }}"
        docker-build-cache-from:
          "type=gha,timeout=10m,scope=ctf-build-image-${{ inputs.cache-scope ||
          format('{0}-{1}', runner.os, runner.arch) }}"
        cache-mode: ${{ inputs.cache-mode }}
        cache-map: ${{ inputs.cache-map || inputs.cache-dance-cache-map }}
        cache-dance: ${{ inputs.cache-dance }}

        tags: type=raw,value=${{ inputs.image-tag }}
        aws-account-number: ${{ inputs.aws-account-number }}
        aws-role-arn: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}

        github-token: ${{ steps.github-token.outputs.access-token || '' }}
