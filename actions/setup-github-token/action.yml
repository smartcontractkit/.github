name: Setup GitHub Token
description: Setup a GitHub Token from GATI

inputs:
  profile:
    description:
      GATI v2 token profile to request. When set, the aws-* inputs are ignored.
      Defaults to the migrated v1 profile for aws-role-arn.
    required: false
  gati-version:
    description:
      Set to "v1" to force the legacy GATI v1 flow, which requires aws-role-arn
      and aws-lambda-url. Defaults to "v2".
    required: false
    default: "v2"
  aws-role-arn:
    description:
      ARN of role capable of getting token from GATI. Required unless profile is
      set. Used by v2 to derive the migrated v1 profile.
    required: false
  aws-lambda-url:
    description: URL of GATI v1 lambda function. Only used by v1.
    required: false
  aws-region:
    description: AWS region. Only used by v1.
    required: false
    default: "us-west-2"
  aws-role-duration-seconds:
    description: Duration of role in seconds. Only used by v1.
    required: false
    default: "900"
  role-session-name:
    description: Session name to use when assuming the role. Only used by v1.
    required: false
    default: "${{ github.run_id }}-${{ github.run_number }}-${{ github.job }}"
  set-git-config:
    description: Set git config
    required: false
    default: "false"

outputs:
  access-token:
    value:
      ${{ steps.get-gh-token.outputs.access-token ||
      steps.get-gh-token-v2.outputs.access-token }}
    description:
      The github access token that has permissions reflecting the current AWS
      role value
  gati-version:
    value: ${{ steps.resolve-gati-version.outputs.version }}
    description: The GATI version that issued the token, "v1" or "v2"

runs:
  using: composite
  steps:
    - name: Resolve GATI version
      id: resolve-gati-version
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
        GATI_VERSION: ${{ inputs.gati-version || 'v2' }}
        AWS_ROLE_ARN: ${{ inputs.aws-role-arn }}
        AWS_LAMBDA_URL: ${{ inputs.aws-lambda-url }}
      # v2 is used unless gati-version forces the legacy v1 flow.
      run: |
        if [[ "${GATI_VERSION}" != "v1" && "${GATI_VERSION}" != "v2" ]]; then
          echo "::error::gati-version must be 'v1' or 'v2', got '${GATI_VERSION}'."
          exit 1
        fi

        if [[ "${GATI_VERSION}" == "v1" ]]; then
          if [[ -n "${PROFILE}" ]]; then
            echo "::error::profile is only supported by GATI v2. Remove the profile input, or unset gati-version."
            exit 1
          fi
          if [[ -z "${AWS_ROLE_ARN}" || -z "${AWS_LAMBDA_URL}" ]]; then
            echo "::error::aws-role-arn and aws-lambda-url are required when gati-version is 'v1'."
            exit 1
          fi
        fi

        if [[ -z "${PROFILE}" ]]; then
          if [[ -z "${AWS_ROLE_ARN}" ]]; then
            echo "::error::Either profile or aws-role-arn is required."
            exit 1
          fi
          # Only read by the v2 flow, which migrates a v1 role ARN as a v1 profile.
          PROFILE="v1/${AWS_ROLE_ARN}"
        fi

        echo "version=${GATI_VERSION}" | tee -a "${GITHUB_OUTPUT}"

        if [[ "${GATI_VERSION}" == "v2" ]]; then
          # Written without tee: the profile can embed an IAM role ARN.
          echo "profile=${PROFILE}" >> "${GITHUB_OUTPUT}"
        fi

    - name: Check the role session name lengths and truncate if needed
      if: steps.resolve-gati-version.outputs.version == 'v1'
      shell: bash
      id: role-session-name
      env:
        ROLE_SESSION_NAME: ${{ inputs.role-session-name }}
      run: |
        if [[ ${#ROLE_SESSION_NAME} -gt 64 ]]; then
          echo "role-session-name=$(echo $ROLE_SESSION_NAME | cut -c1-64)" >> "$GITHUB_OUTPUT"
        else
          echo "role-session-name=$ROLE_SESSION_NAME" >> "$GITHUB_OUTPUT"
        fi

    - name: Assume role capable of getting token from gati
      if: steps.resolve-gati-version.outputs.version == 'v1'
      uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
      with:
        aws-region: ${{ inputs.aws-region }}
        mask-aws-account-id: true
        role-duration-seconds: ${{ inputs.aws-role-duration-seconds }}
        role-session-name:
          ${{ steps.role-session-name.outputs.role-session-name }}
        role-to-assume: ${{ inputs.aws-role-arn }}

    - name: Get github token from gati (v1)
      id: get-gh-token
      if: steps.resolve-gati-version.outputs.version == 'v1'
      uses: smartcontractkit/.github/actions/invoke-gati@invoke-gati/0.3.0
      with:
        url: ${{ inputs.aws-lambda-url }}

    - name: Get github token from gati (v2)
      id: get-gh-token-v2
      if: steps.resolve-gati-version.outputs.version == 'v2'
      uses: smartcontractkit/.github/actions/invoke-gati-v2@invoke-gati-v2/0.1.0
      with:
        profile: ${{ steps.resolve-gati-version.outputs.profile }}

    - name: Configure github token
      if: inputs.set-git-config == 'true'
      shell: bash
      env:
        ACCESS_TOKEN:
          ${{ steps.get-gh-token.outputs.access-token ||
          steps.get-gh-token-v2.outputs.access-token }}
      run: |
        git config --global \
          url."https://x-access-token:${ACCESS_TOKEN}@github.com/".insteadOf \
          "https://github.com/"
