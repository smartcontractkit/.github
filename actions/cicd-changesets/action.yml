name: cicd-changesets
description: "changesets"

inputs:
  # general inputs
  checkout-repo-fetch-depth:
    description: "number of commits to fetch"
    required: false
    default: "0"
  git-user:
    description: ""
    required: false
    default: app-token-issuer-infra-releng[bot]@users.noreply.github.com
  git-email:
    description: ""
    required: false
    default: app-token-issuer-infra-releng[bot]
  # token inputs
  github-token:
    description: |
      GitHub token used to checkout the repo and create/publish the release PR
      and tags. Defaults to the automatic GITHUB_TOKEN.

      This is only used when GATI is not configured (i.e. `aws-role-arn` is
      empty). When `aws-role-arn` is set, a GATI-issued token is used instead
      and this input is ignored.

      When relying on the default GITHUB_TOKEN, the calling job must grant
      `contents: write` and `pull-requests: write` permissions.
    required: false
    default: ${{ github.token }}
  # aws inputs (GATI) - optional
  # Provide these to issue a token via GATI instead of using `github-token`.
  aws-role-duration-seconds:
    description: ""
    required: false
    default: "900"
  aws-region:
    description: ""
    required: false
  aws-role-arn:
    description: ""
    required: false
  aws-lambda-url:
    description: ""
    required: false
  # toolchain inputs
  package-manager:
    description: |
      Which package manager installs dependencies and runs the changesets
      commands: `pnpm` (default) or `bun`.

      With `pnpm`, Node and pnpm are installed and `pnpm install` runs. With
      `bun`, neither is installed: bun is set up instead and
      `bun install --frozen-lockfile` runs, so a bun repo needs no
      `engines.node` in its package.json and no pnpm lockfile.
    required: false
    default: "pnpm"
  bun-version:
    description: |
      The bun version to install, e.g. `1.3.14`. Only used when
      `package-manager` is `bun`. Takes precedence over `bun-version-file` and
      auto-detection. Leave it empty (the default) to read the version from
      the repo's own pin instead of restating it here, where it can drift.
    required: false
    default: ""
  bun-version-file:
    description: |
      Path to a file the bun version is read from when `bun-version` is empty.
      Only used when `package-manager` is `bun`.

      setup-bun reads `.tool-versions`, `.bun-version`, and `package.json`
      (`packageManager`, else `engines.bun`) natively, so this action forwards
      those straight to setup-bun. It does not understand `mise.toml`, which is
      where our TypeScript repos pin an exact bun, so this action reads
      `mise.toml`, `.mise.toml`, and `.config/mise/config.toml` itself and
      passes the version to setup-bun as `bun-version`.

      Leave it empty (the default) to auto-detect: the action checks for a mise
      file first, then forwards `.tool-versions` or `.bun-version` to setup-bun
      if present, and setup-bun finally reads `package.json` or installs
      `latest`.
    required: false
    default: ""
  # nodejs inputs (package-manager: pnpm only)
  node-version-file:
    description: ""
    required: false
    default: ".tool-versions"
  pnpm-version:
    description: ""
    required: false
    default: "^10.0.0"
  pnpm-use-cache:
    description: "Use cache for pnpm"
    required: false
    default: "true"
  # changesets inputs
  changesets-publish-cmd:
    description: |
      Defaults to `<package-manager> run ci:changeset:publish`, i.e.
      `pnpm run ci:changeset:publish` unless `package-manager` is `bun`.
    required: false
    default: ""
  changesets-version-cmd:
    description: |
      Defaults to `<package-manager> run ci:changeset:version`, i.e.
      `pnpm run ci:changeset:version` unless `package-manager` is `bun`.
    required: false
    default: ""
  changesets-create-gh-release:
    description: ""
    required: false
    default: "false"
  changesets-tag-separator:
    description: |
      What character to use to separate the package name and version in the tag.
      For example:
        - Using `@`, the resulting git tag will be <package>@<version>
        - Using `/`, the resulting git tag will be <package>/<version>
        - Using `/v` the resulting git tag will be <package>/v<version>
    required: false
    default: "@"
  changesets-major-version-tags:
    description: |
      Create and mutate major version tags for each package.
      Uses the same separator as above.
    required: false
    default: "false"
  changesets-root-version-package-path:
    description: |
      Path to a package.json file that should use simplified v<version> tags
      instead of <name><separator><version> tags. The package.json must have
      chainlink.changesets.rootVersion set to true. If this path is provided
      but the field is not set correctly, the action will fail.
    required: false
  pr-title:
    description: "title of the PR"
    required: false
  pr-draft:
    description: "whether to put the PR in draft mode or not"
    required: false
    default: "false"
outputs:
  published:
    description:
      A boolean value to indicate whether a publishing is happened or not
    value: ${{ steps.changesets.outputs.published }}
  publishedPackages:
    description: >
      A JSON array to present the published packages. The format is `[{"name":
      "@xx/xx", "version": "1.2.0"}, {"name": "@xx/xy", "version": "0.8.9"}]`
    value: ${{ steps.changesets.outputs.publishedPackages }}
  hasChangesets:
    description:
      A boolean about whether there were changesets. Useful if you want to
      create your own publishing functionality.
    value: ${{ steps.changesets.outputs.hasChangesets }}
  pullRequestNumber:
    description: The pull request number that was created or updated
    value: ${{ steps.changesets.outputs.pullRequestNumber }}

runs:
  using: composite
  steps:
    - name: Validate package-manager
      shell: bash
      env:
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
      run: |
        set -euo pipefail
        case "${PACKAGE_MANAGER}" in
          pnpm | bun) ;;
          *)
            echo "::error::package-manager must be 'pnpm' or 'bun', got '${PACKAGE_MANAGER}'"
            exit 1
            ;;
        esac

    # GATI is optional. This step only runs when `aws-role-arn` is provided.
    # When GATI is not configured, the action falls back to `github-token`
    # (the automatic GITHUB_TOKEN by default). Using GATI requires the calling
    # job to grant `id-token: write` permission.
    - name: Setup gh token (GATI)
      id: setup-gh-token
      if: inputs.aws-role-arn != ''
      uses: smartcontractkit/.github/actions/setup-github-token@setup-github-token/v1
      with:
        aws-role-arn: ${{ inputs.aws-role-arn }}
        aws-lambda-url: ${{ inputs.aws-lambda-url }}
        aws-region: ${{ inputs.aws-region }}
        aws-role-duration-seconds: ${{ inputs.aws-role-duration-seconds }}

    # Prefer the GATI-issued token when present, otherwise use `github-token`.
    - name: Resolve gh token
      id: resolve-gh-token
      shell: bash
      env:
        GATI_TOKEN: ${{ steps.setup-gh-token.outputs.access-token }}
        GITHUB_TOKEN_INPUT: ${{ inputs.github-token }}
      run: |
        if [[ -n "${GATI_TOKEN}" ]]; then
          TOKEN="${GATI_TOKEN}"
        else
          TOKEN="${GITHUB_TOKEN_INPUT}"
        fi
        if [[ -z "${TOKEN}" ]]; then
          echo "::error::No GitHub token available. Provide GATI inputs (aws-role-arn, aws-lambda-url, aws-region) or set github-token."
          exit 1
        fi
        echo "::add-mask::${TOKEN}"
        echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"

    - name: Checkout repo
      uses: actions/checkout@v7
      with:
        fetch-depth: ${{ inputs.checkout-repo-fetch-depth }}
        token: ${{ steps.resolve-gh-token.outputs.token }}

    - name: Set git config
      shell: bash
      run: |
        git config user.email "${{ inputs.git-email }}"
        git config user.name "${{ inputs.git-user }}"

    # One of the two toolchain paths below runs, never both. `bun` skips Node and
    # pnpm entirely: a bun repo has no pnpm lockfile to install from, and its
    # package.json carries `engines.bun` rather than the `engines.node` that
    # node-version-file needs.
    - name: Setup nodejs
      if: inputs.package-manager == 'pnpm'
      uses: smartcontractkit/.github/actions/setup-nodejs@setup-nodejs/v1
      with:
        node-version-file: ${{ inputs.node-version-file }}
        pnpm-version: ${{ inputs.pnpm-version }}
        use-cache: ${{ inputs.pnpm-use-cache }}
        run-install: "true"

    # setup-bun reads .tool-versions, .bun-version, and package.json natively
    # via its bun-version-file input, so those are forwarded to it unchanged.
    # It does not read mise.toml, which is where our TypeScript repos pin an
    # exact bun, so that one case is resolved here and passed as bun-version.
    # `bun-version` still wins when set, the same way setup-nodejs lets
    # pnpm-version override .tool-versions.
    - name: Resolve bun version
      id: bun-version
      if: inputs.package-manager == 'bun'
      shell: bash
      env:
        BUN_VERSION: ${{ inputs.bun-version }}
        BUN_VERSION_FILE: ${{ inputs.bun-version-file }}
      run: |
        set -euo pipefail

        # Print the bun entry of a mise [tools] table, in any of the forms mise
        # accepts: a bare string, an array of versions, or a table with a
        # version key.
        mise_bun_line() {
          awk '
            /^[[:space:]]*\[/ { tools = ($0 ~ /^[[:space:]]*\[tools\][[:space:]]*$/); next }
            tools && /^[[:space:]]*("bun"|bun)[[:space:]]*=/ { print; exit }
          ' "$1"
        }

        out_version=""
        out_file=""

        if [[ -n "${BUN_VERSION}" ]]; then
          # Explicit override wins; do not read any file.
          out_version="${BUN_VERSION}"
        else
          # Pick the mise file to read, if any: an explicit bun-version-file
          # that names one, else the first of the local mise paths that exists.
          mise_file=""
          if [[ -n "${BUN_VERSION_FILE}" ]]; then
            case "$(basename "${BUN_VERSION_FILE}")" in
              mise.toml | .mise.toml | config.toml) mise_file="${BUN_VERSION_FILE}" ;;
            esac
          else
            for c in mise.toml .mise.toml .config/mise/config.toml; do
              [[ -f "${c}" ]] && { mise_file="${c}"; break; }
            done
          fi

          if [[ -n "${mise_file}" ]]; then
            if [[ ! -f "${mise_file}" ]]; then
              echo "::error::bun-version-file '${mise_file}' does not exist"
              exit 1
            fi
            raw=$(mise_bun_line "${mise_file}")
            raw="${raw#*=}"
            raw="${raw%%#*}"
            raw=$(printf '%s' "${raw}" | tr -d "\"'[]{} ")
            raw="${raw##*=}"
            raw="${raw%%,*}"
            if [[ -n "${raw}" ]]; then
              out_version="${raw}"
              echo "Using bun version from ${mise_file}: ${out_version}"
            elif [[ -n "${BUN_VERSION_FILE}" ]]; then
              # An explicitly named mise file must pin bun; an auto-detected
              # one that does not is just skipped.
              echo "::error::bun-version-file '${mise_file}' does not pin a bun version"
              exit 1
            fi
          fi

          # No mise pin: forward a non-mise bun-version-file, or an
          # auto-detected .tool-versions / .bun-version, to setup-bun, which
          # reads those natively. package.json is read by setup-bun
          # automatically when no file is given, so it is never forwarded.
          if [[ -z "${out_version}" ]]; then
            if [[ -n "${BUN_VERSION_FILE}" ]]; then
              out_file="${BUN_VERSION_FILE}"
            else
              for c in .tool-versions .bun-version; do
                [[ -f "${c}" ]] && { out_file="${c}"; break; }
              done
            fi
          fi
        fi

        echo "version=${out_version}" >> "${GITHUB_OUTPUT}"
        echo "file=${out_file}" >> "${GITHUB_OUTPUT}"

    - name: Setup bun
      if: inputs.package-manager == 'bun'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ steps.bun-version.outputs.version }}
        bun-version-file: ${{ steps.bun-version.outputs.file }}

    # bun.lock records the root package's name and its dependencies, not the
    # root's own version, so a `changeset version` bump does not invalidate it
    # and --frozen-lockfile keeps holding across releases.
    - name: Run package manager install (bun)
      if: inputs.package-manager == 'bun'
      shell: bash
      run: bun install --frozen-lockfile

    # Both commands default to the selected package manager, so a bun caller
    # that overrides neither does not fall back to a pnpm that was never
    # installed. For a pnpm caller the resolved values are unchanged.
    - name: Resolve changesets commands
      id: cmds
      shell: bash
      env:
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
        PUBLISH_CMD: ${{ inputs.changesets-publish-cmd }}
        VERSION_CMD: ${{ inputs.changesets-version-cmd }}
      run: |
        set -euo pipefail
        {
          echo "publish=${PUBLISH_CMD:-${PACKAGE_MANAGER} run ci:changeset:publish}"
          echo "version=${VERSION_CMD:-${PACKAGE_MANAGER} run ci:changeset:version}"
        } | tee -a "${GITHUB_OUTPUT}"

    - name: Run changesets
      id: changesets
      uses: smartcontractkit/.github/actions/signed-commits@changesets-signed-commits/v1
      env:
        GITHUB_TOKEN: ${{ steps.resolve-gh-token.outputs.token }}
      with:
        publish: ${{ steps.cmds.outputs.publish }}
        version: ${{ steps.cmds.outputs.version }}
        createGithubReleases: ${{ inputs.changesets-create-gh-release }}
        rootVersionPackagePath:
          ${{ inputs.changesets-root-version-package-path }}
        setupGitUser: false
        title: ${{ inputs.pr-title }}
        prDraft: ${{ inputs.pr-draft }}
        tagSeparator: ${{ inputs.changesets-tag-separator }}
        createMajorVersionTags: ${{ inputs.changesets-major-version-tags }}

    - name: Check changesets output
      shell: bash
      run: |
        echo "published: ${{ steps.changesets.outputs.published }}"
        echo "publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}"
        echo "hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}"
        echo "pullRequestNumber: ${{ steps.changesets.outputs.pullRequestNumber }}"
