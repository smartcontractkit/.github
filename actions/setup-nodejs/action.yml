name: Setup nodejs
description: Setup Nodejs and Pnpm with caching

inputs:
  node-version:
    description:
      The node version to use. This value takes precedence over the
      node-version-file input. Leave it empty to resolve the version from a file
      instead.
    required: false
  node-version-file:
    description: |
      Path to a file the node version is read from when `node-version` is
      empty. setup-node reads `.tool-versions`, `.nvmrc`, and `package.json`
      natively, so those are forwarded to it unchanged. It does not understand
      `mise.toml`, so mise files (`mise.toml`, `.mise.toml`,
      `.config/mise/config.toml`) are read by this action and passed to
      setup-node as a version instead. Leave it empty (the default) to
      auto-detect: a mise file first, then `.tool-versions` or `.nvmrc`, and
      setup-node's own default if no file is found.
    required: false
  pnpm-version:
    description:
      The pnpm version to use. This value takes precedence over the version
      pinned in mise.toml or .tool-versions. Pseudo-default is ^12.0.0.
    required: false
  mise-install:
    description:
      "Run `mise install` to provision every tool pinned in the repo's mise.toml
      (e.g. node, pnpm, shellcheck) for later steps. Set to false to skip
      provisioning. Version resolution is unaffected by this input."
    required: true
    default: "true"
  use-cache:
    description: Enable github actions cache
    required: true
    default: "true"
  restore-cache-only:
    description: Restore cache only, do not create a new cache
    required: true
    default: "false"
  run-install:
    description: Run npm/yarn/pnpm install
    required: true
    default: "true"
  install-command:
    description: The command to run to install dependencies
    required: false
    default: "pnpm install"
  package-json-directory:
    description:
      The sub-directory of the package.json, if not at the root of the
      repository
    required: false
    default: "."
  registry-url:
    description: The npm registry URL to use
    required: false

runs:
  using: composite
  steps:
    - name: Detect mise config
      id: mise-config
      shell: bash
      run: |
        if [[ -f mise.toml || -f .mise.toml || -f .config/mise/config.toml ]]; then
          echo "found=true" | tee -a "${GITHUB_OUTPUT}"
        fi

    - name: Install mise tools
      if:
        steps.mise-config.outputs.found == 'true' && inputs.mise-install ==
        'true'
      uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

    - name: Resolve versions
      id: versions
      shell: bash
      env:
        NODE_VERSION: ${{ inputs.node-version }}
        NODE_VERSION_FILE: ${{ inputs.node-version-file }}
        PNPM_VERSION: ${{ inputs.pnpm-version }}
        PNPM_FALLBACK: "^12.0.0"
      run: "${GITHUB_ACTION_PATH}/scripts/resolve-versions.sh"

    - name: Install node
      uses: actions/setup-node@v6
      with:
        node-version: ${{ steps.versions.outputs.node-version }}
        node-version-file: ${{ steps.versions.outputs.node-version-file }}
        registry-url: ${{ inputs.registry-url }}

    - name: Install pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      with:
        version: ${{ steps.versions.outputs.pnpm-version }}
        run_install: false

    - name: Get pnpm store directory
      if: inputs.use-cache == 'true'
      id: pnpm-cache
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path)" | tee -a "${GITHUB_OUTPUT}"

    - name: Setup pnpm cache
      if: inputs.use-cache == 'true' && inputs.restore-cache-only == 'false'
      uses: actions/cache@v5
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Restore pnpm cache
      if: inputs.use-cache == 'true' && inputs.restore-cache-only == 'true'
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Run package manager install
      if: inputs.run-install == 'true'
      shell: bash
      working-directory: ${{ inputs.package-json-directory }}
      env:
        INSTALL_COMMAND: ${{ inputs.install-command }}
      run: |
        if [ -z "$INSTALL_COMMAND" ]; then
          echo "::error::No install command provided, skipping install step."
          exit 1
        fi

        $INSTALL_COMMAND
