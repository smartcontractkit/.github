name: ci-prettier
description: Prettier Code Formatter

inputs:
  # specific inputs
  prettier-command:
    description: "Command to run prettier"
    required: false
    default: "pnpm run prettier:check"
  # general inputs
  checkout-repo:
    description: "enable git checkout repo"
    required: false
    default: "true"
  checkout-repo-fetch-depth:
    description: "number of commits to fetch"
    required: false
    default: "0"
  # nodejs inputs
  node-version-file:
    description:
      "path to a version file for node (mise.toml, .tool-versions, .nvmrc);
      empty auto-detects"
    required: false
    default: ""
  nodejs-version:
    description:
      "NodeJS version written to node-version-file when that file doesn't exist"
    required: false
    default: "^26.0.0"
  pnpm-version:
    description:
      "pnpm version; empty reads it from mise.toml/.tool-versions, falling back
      to ^12.0.0"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Checkout repo
      if: inputs.checkout-repo == 'true'
      uses: actions/checkout@v7
      with:
        fetch-depth: ${{ inputs.checkout-repo-fetch-depth }}

    - name: Create version file if it doesn't exist
      if: inputs.node-version-file != ''
      shell: bash
      run: |
        if [ ! -f "${{ inputs.node-version-file }}" ]; then
          echo "nodejs ${{ inputs.nodejs-version }}" > ${{ inputs.node-version-file }}
        fi

    - name: Setup nodejs
      uses: smartcontractkit/.github/actions/setup-nodejs@setup-nodejs/v1
      with:
        node-version-file: ${{ inputs.node-version-file }}
        pnpm-version: ${{ inputs.pnpm-version }}
        use-cache: "true"
        run-install: "true"
      continue-on-error: true

    # Prettier must be available in the project's package.json as a dep.
    - name: Run Prettier Check
      shell: bash
      run: ${{ inputs.prettier-command }}
