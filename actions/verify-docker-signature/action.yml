name: verify-docker-signature
description: |
  Verify a cosign signature on a Docker image/manifest, retrying to absorb
  Sigstore/Rekor propagation lag (the "no signatures found" false negative that
  can occur right after a successful sign).

  This is intentionally decoupled from manifest create/sign so a propagation
  flake can be retried on its own WITHOUT re-running create/sign — the sequence
  that previously caused index digest drift (RANE-4683).

inputs:
  image:
    description:
      "Image reference to verify, including digest (e.g.
      registry/repo@sha256:...)."
    required: true
  identity-regexp:
    description: |
      Expected Fulcio certificate identity regexp. Prefix with ^ and suffix with
      $ for security. Accepts RE2 syntax.
    required: true
  workflow-repository:
    description: "Expected GitHub workflow repository (owner/repo)."
    required: true
  oidc-issuer:
    description: "Expected certificate OIDC issuer."
    required: false
    default: "https://token.actions.githubusercontent.com"
  max-retries:
    description: "Maximum number of verification attempts."
    required: false
    default: "5"
  retry-delay-seconds:
    description: "Delay between attempts, in seconds."
    required: false
    default: "10"
  cosign-release:
    description:
      "cosign version to install (https://github.com/sigstore/cosign/releases)."
    required: false
    default: "v2.6.1"

runs:
  using: composite
  steps:
    - name: Install cosign
      uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
      with:
        cosign-release: ${{ inputs.cosign-release }}

    - name: Verify signature (with retry)
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        OIDC_ISSUER: ${{ inputs.oidc-issuer }}
        OIDC_IDENTITY_REGEXP: ${{ inputs.identity-regexp }}
        GITHUB_WORKFLOW_REPOSITORY: ${{ inputs.workflow-repository }}
        MAX_RETRIES: ${{ inputs.max-retries }}
        RETRY_DELAY_SECONDS: ${{ inputs.retry-delay-seconds }}
      run: "${GITHUB_ACTION_PATH}/scripts/verify-with-retry.sh"
