name: Reusable Autofix

on:
  workflow_call:
    inputs:
      working-directory:
        description: |
          Directory the `setup` and `run` commands and the Go fixers run in,
          relative to the repository root.
        required: false
        type: string
        default: "."
      paths:
        description: |
          Files this autofix owns, as git pathspecs relative to the repository
          root, one per line. Only changes to these files are committed, the Go
          fixers only fix modules in them, and pull requests that change none
          of them are skipped. Defaults to `working-directory`. For example:

            paths: |
              .
              :!cre
        required: false
        type: string
        default: ""
      setup:
        description: |
          Shell commands to run in `working-directory` before the Go fixers:
          installing tools `go generate` needs, formatting or generating what
          Go is generated from (e.g. protos), ... For example:

            setup: |
              make install-tools
              ./script/format-protos.sh
        required: false
        type: string
        default: ""
      run:
        description: |
          Shell commands to run in `working-directory` after the Go fixers:
          what's derived from the fixed modules (e.g. a module graph from the
          tidied go.mod files), formatters for other languages, ... For
          example:

            run: |
              make modgraph
              prettier --write .
        required: false
        type: string
        default: ""
      go:
        description:
          Run the Go fixers (go mod tidy, go fix, go fmt, go generate, go mod
          tidy).
        required: false
        type: boolean
        default: false
      go-recursive:
        description: |
          Run the Go fixers in every module in `paths` in or below
          `working-directory`. When false, only in the module at
          `working-directory`.
        required: false
        type: boolean
        default: true
      go-changed-only:
        description: |
          On pull requests, run the Go fixers only in the modules owning a
          file the pull request changed, and the modules that replace those
          with a local path. Only applies when `go-recursive` is true. Every
          module is fixed when the changed files can't be listed (not a pull
          request, 300 or more files, ...), so the default branch and merge
          queue still check them all. Every module is fixed too when the pull
          request changes a file that can affect them all: anything under
          `.github`, `go.work`, `go.work.sum`, a golangci-lint config when
          `golangci-lint` is true, or `go-all-paths`.
        required: false
        type: boolean
        default: false
      go-all-paths:
        description: |
          Git pathspecs, relative to the repository root, one per line, of
          more files whose change makes `go-changed-only` fix every module,
          e.g. the file the golangci-lint version is read from.
        required: false
        type: string
        default: ""
      golangci-lint:
        description: |
          Run `golangci-lint run --fix` in the modules the Go fixers fix, after
          them. Its fixes are committed with the others. Issues it can't fix
          are annotated and fail the run, after the fixes are committed.
        required: false
        type: boolean
        default: false
      golangci-lint-version:
        description: |
          golangci-lint version to install, e.g. "v2.15.0". When empty, uses
          the golangci-lint already installed.
        required: false
        type: string
        default: ""
      golangci-lint-config:
        description: |
          golangci-lint config file, relative to the repository root. When
          empty, golangci-lint finds it in or above each module, and modules
          without one use ci-lint-go's default config.
        required: false
        type: string
        default: ""
      golangci-lint-args:
        description: |
          Extra arguments to `golangci-lint run`, split on whitespace.
        required: false
        type: string
        default: ""
      always:
        description: Run on pull requests that change no file in `paths` too.
        required: false
        type: boolean
        default: false
      setup-go:
        description: |
          Install Go. Always done when `go` is true, set to true when the
          `run` commands need Go.
        required: false
        type: boolean
        default: false
      go-version-file:
        description: |
          go.mod used to determine the Go version. Defaults to the go.mod in
          `working-directory`, else the first module the Go fixers would fix,
          else the root go.mod. Modules requiring a newer Go download it
          automatically.
        required: false
        type: string
        default: ""
      commit-message:
        description: Message of the autofix commit.
        required: false
        type: string
        default: "chore: autofix"
      gati-profile:
        description: |
          GATI v2 profile used to get the token that pushes the commit, which
          needs `contents: write`. Commits pushed with the default
          GITHUB_TOKEN don't trigger workflow runs, so checks would never run
          on the autofix commit. The default, `globals/write-self`, grants
          `contents: write` on the calling repository only.
        required: false
        type: string
        default: "globals/write-self"
      runs-on:
        description: Runner to use.
        required: false
        type: string
        default: "ubuntu-latest"
    outputs:
      skipped:
        description:
          Whether the fixers were skipped because the pull request changed no
          file in `paths`, "true" or "false".
        value: ${{ jobs.fix.outputs.skipped }}
      changed:
        description: Whether the commands changed any files, "true" or "false".
        value: ${{ jobs.fix.outputs.changed }}
      committed:
        description: Whether an autofix commit was pushed, "true" or "false".
        value: ${{ jobs.commit.outputs.committed || 'false' }}

permissions: {}

jobs:
  # Runs the fixers, which run code from the pull request (`setup`, `run`,
  # `go generate`), so it holds no token beyond read access.
  fix:
    name: Autofix
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    outputs:
      skipped: ${{ steps.autofix.outputs.skipped }}
      changed: ${{ steps.autofix.outputs.changed }}
      commit: ${{ steps.autofix.outputs.commit }}
      artifact: ${{ steps.autofix.outputs.artifact }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Autofix
        id: autofix
        uses: smartcontractkit/.github/actions/autofix@autofix/v1
        with:
          working-directory: ${{ inputs.working-directory }}
          paths: ${{ inputs.paths }}
          setup: ${{ inputs.setup }}
          run: ${{ inputs.run }}
          go: ${{ inputs.go }}
          go-recursive: ${{ inputs.go-recursive }}
          go-changed-only: ${{ inputs.go-changed-only }}
          go-all-paths: ${{ inputs.go-all-paths }}
          golangci-lint: ${{ inputs.golangci-lint }}
          golangci-lint-version: ${{ inputs.golangci-lint-version }}
          golangci-lint-config: ${{ inputs.golangci-lint-config }}
          golangci-lint-args: ${{ inputs.golangci-lint-args }}
          always: ${{ inputs.always }}
          setup-go: ${{ inputs.setup-go || inputs.go || inputs.golangci-lint }}
          go-version-file: ${{ inputs.go-version-file }}

  # Pushes the fixes. Holds the token to, so it runs nothing from the pull
  # request and checks out nothing. Runs when fix failed too: the only failure
  # after its changes are uploaded is golangci-lint issues it couldn't fix, and
  # the fixes it could make should still be pushed.
  commit:
    name: Autofix commit
    needs: fix
    if: ${{ !cancelled() && needs.fix.outputs.commit == 'true' }}
    runs-on: ${{ inputs.runs-on }}
    permissions:
      id-token: write
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
    steps:
      - name: Get GitHub token
        id: token
        uses: smartcontractkit/.github/actions/setup-github-token@setup-github-token/v1
        with:
          profile: ${{ inputs.gati-profile }}

      - name: Commit
        id: commit
        uses: smartcontractkit/.github/actions/autofix/commit@autofix/v1
        with:
          artifact: ${{ needs.fix.outputs.artifact }}
          # From the inputs, which the pull request can't influence, rather
          # than from the fix job.
          paths: ${{ inputs.paths || inputs.working-directory }}
          github-token: ${{ steps.token.outputs.access-token }}
          commit-message: ${{ inputs.commit-message }}
