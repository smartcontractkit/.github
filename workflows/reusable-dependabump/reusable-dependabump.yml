name: dependabump

on:
  workflow_call:
    secrets:
      SLACK_TOKEN:
        required: true
      SLACK_CHANNEL_ID:
        required: true
    inputs:
      severity:
        required: false
        type: string
        default: 'critical,high,moderate'
      post-bump-command:
        required: false
        type: string
      runs-on:
        description: |
          Runner label. Use a larger runner when tidying every module does not fit
          on the default runner's disk.
        required: false
        type: string
        default: 'ubuntu-latest'
      gati-profile:
        description: |
          GATI v2 profile for a token that git uses to fetch private Go
          modules. The profile needs `contents: read` on those repositories.
        required: false
        type: string
      goprivate:
        description: |
          Value for GOPRIVATE, e.g. `github.com/smartcontractkit/atlas`. Modules
          matching it skip the public proxy and checksum database.
        required: false
        type: string

permissions: { }

jobs:
  dependabump:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: write
      pull-requests: write
      actions: read
      security-events: read
      vulnerability-alerts: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GOPRIVATE: ${{ inputs.goprivate }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7

      - name: Setup GitHub Token
        if: inputs.gati-profile != ''
        uses: smartcontractkit/.github/actions/setup-github-token@setup-github-token/v1
        with:
          profile: ${{ inputs.gati-profile }}
          set-git-config: "true"

      - name: Enforce Auto Toolchain
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"

      - name: Install tools
        id: install
        run: |
          go install github.com/jmank88/gomods@ec230e90e89d4310b21fdeeba0d1290a3821a901 && \
          go install github.com/smartcontractkit/chainlink-common/script/cmd/dependabot@70b55abaf6e19d887c219b497046838d6113f22c
        continue-on-error: true

      - name: Bump Dependencies
        id: bump
        env:
          SEVERITY: ${{ inputs.severity }}
        if: steps.install.outcome == 'success'
        run: |
          if ! printf '%s' "$SEVERITY" | grep -Eq '^[[:space:]]*(critical|high|moderate|low)([[:space:]]*,[[:space:]]*(critical|high|moderate|low))*[[:space:]]*$'; then
            echo "Invalid severity input: $SEVERITY" >&2
            exit 1
          fi
          SEVERITY="${SEVERITY//[[:space:]]/}"
          alerts="$RUNNER_TEMP/alerts.tsv"
          gh api --paginate -H "Accept: application/vnd.github+json" --method GET \
            "/repos/${GITHUB_REPOSITORY}/dependabot/alerts?state=open&ecosystem=Go&severity=${SEVERITY}" \
            --jq '.[] | select(.security_vulnerability.first_patched_version != null) | [.security_advisory.severity, .security_advisory.ghsa_id, (.security_advisory.cve_id // "-"), .security_vulnerability.package.name, .security_vulnerability.first_patched_version.identifier, (.dependency.manifest_path | rtrimstr("go.mod"))] | @tsv' > "$alerts"
          awk -F'\t' '{ printf "./%s %s %s\n", $6, $4, $5 }' "$alerts" | dependabot
          gomods tidy

          {
            echo "Upgrading vulnerable dependencies to the minimum version that fixes each advisory (\`first_patched_version\`), not the latest release."
            echo
            echo "| Severity | Dependency | Fixed in | Advisory |"
            echo "| --- | --- | --- | --- |"
            awk -F'\t' '{
              severity = toupper(substr($1, 1, 1)) substr($1, 2)
              advisory = ($3 == "-") ? $2 : $3 " / " $2
              printf "| %s | `%s` | %s | %s |\n", severity, $4, $5, advisory
            }' "$alerts"
            echo
            echo "_Indirect dependencies may also have been raised by \`go mod tidy\`._"
          } > "$RUNNER_TEMP/pr-body.md"

          awk -F'\t' '
            { n++; counts[$1]++ }
            END {
              line = (n + 0) (n == 1 ? " dependency bump" : " dependency bumps")
              split("critical high medium low", order, " ")
              detail = ""
              sep = ""
              for (i = 1; i <= 4; i++) {
                if (counts[order[i]] > 0) {
                  detail = detail sep counts[order[i]] " " order[i]
                  sep = ", "
                }
              }
              print line (detail == "" ? "" : " (" detail ")")
            }' "$alerts" > "$RUNNER_TEMP/slack-summary.txt"
          awk -F'\t' '{ printf "• `%s` → %s (%s)\n", $4, $5, $1 }' "$alerts" >> "$RUNNER_TEMP/slack-summary.txt"

          {
            echo "summary<<EOF"
            cat "$RUNNER_TEMP/slack-summary.txt"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "changed=false" | tee -a "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Install Nix
        if: ${{ steps.bump.outcome == 'success' && steps.bump.outputs.changed == 'true' && contains(inputs.post-bump-command, 'nix') }}
        uses: cachix/install-nix-action@02a151ada4993995686f9ed4f1be7cfbb229e56f # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Post-bump Command
        id: post-bump
        if: ${{ steps.bump.outcome == 'success' && steps.bump.outputs.changed == 'true' && inputs.post-bump-command != '' }}
        env:
          POST_BUMP_COMMAND: ${{ inputs.post-bump-command }}
        run: eval "${POST_BUMP_COMMAND}"
        continue-on-error: true

      - name: Notify Failure
        if: ${{ steps.install.outcome == 'failure' || steps.bump.outcome == 'failure' || steps.post-bump.outcome == 'failure' }}
        uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 # v3.0.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID}}
            text: |
              Failed to check for vulnerable dependencies in `${{ github.event.repository.name }}` - <${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}|Run>

      - name: Exit on Failure
        if: ${{ steps.install.outcome == 'failure' || steps.bump.outcome == 'failure' || steps.post-bump.outcome == 'failure' }}
        run: exit 1

      - name: Create Pull Request
        id: pr
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: bot/dependabump
          commit-message: "bump dependencies"
          title: "dependabump"
          body-path: ${{ runner.temp }}/pr-body.md
          sign-commits: true
        continue-on-error: true

      - name: Notify PR Failure
        if: ${{ steps.pr.outcome == 'failure' }}
        uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 # v3.0.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID}}
            text: |
              Vulnerable dependencies detected in `${{ github.event.repository.name }}`! :panic:
              Failed to create PR: <${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}|Run>

      - name: Exit on PR Failure
        if: ${{ steps.pr.outcome == 'failure' }}
        run: exit 1

      - name: Notify PR Created
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 # v3.0.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID}}
            text: |
              Vulnerable dependencies detected in `${{ github.event.repository.name }}`! :panic: - <${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}|Run>
              ${{ steps.bump.outputs.summary }}
              Upgrade PR for review: ${{ steps.pr.outputs.pull-request-url }}
