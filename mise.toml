[tools]
node = "26.10.0"
pnpm = "12.9.1"
shellcheck = "0.11.0"

[tasks.install]
description = "Install tools, npm dependencies, and git hooks"
run = ["mise install", "pnpm install", "pnpm lefthook install"]

[tasks.lint]
description = "Lint all projects"
run = "pnpm run lint"

[tasks.build]
description = "Build all projects"
run = "pnpm run build"

[tasks.test]
description = "Test all projects"
run = "pnpm run test"

[tasks.format]
description = "Format all files with prettier"
run = "pnpm run prettier:write"

[tasks."workflows:sync"]
description = "Sync reusable workflows into .github/workflows"
run = "pnpm run workflows:fix"
